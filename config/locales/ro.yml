ro:
  label_notification_filter: "Filtru notificări"
  label_nf_global: "Setări globale (se aplică tuturor proiectelor)"
  label_nf_per_project: "Excepții per proiect"
  label_nf_add_project: "Adaugă o excepție pentru proiect"
  label_nf_choose_project: "alegeți un proiect"
  label_nf_add_button: "Adaugă"
  label_nf_mode_inherit: "Folosește setările globale"
  label_nf_mode_all: "Trimite toate modificările (ca până acum)"
  label_nf_mode_comments_only: "Doar comentarii – plus modificări ale subiectului sau descrierii, nimic altceva"
  label_nf_mode_transitions: "Comentarii + modificări ale subiectului/descrierii + tranzițiile de stare selectate (mai jos)"
  label_nf_mode_mentions_only: "Doar mențiuni – doar când cineva vă menționează cu @ (într-un comentariu sau în descriere); nimic altceva, nici tichete noi sau atribuiri"
  text_nf_mentions_only_tip: "Pentru a primi mențiuni, notificările prin e-mail trebuie să fie active: %{account} → %{field} → orice opțiune în afară de „%{none}”. Cu „%{none}”, Redmine nu trimite nimic, nici mențiuni (nici e-mail, nici clopoțel)."
  text_notification_filter_intro: "Alegeți ce modificări ale tichetelor vă trimit notificări (e-mail și clopoțel). În primele trei moduri, comentariile și modificările subiectului sau descrierii vă notifică ÎNTOTDEAUNA. În cele două moduri din mijloc, nimic altceva – modificările de stare doar dacă le bifați mai jos; celelalte câmpuri (versiune țintă, atribuit, merge request, fișiere…) niciodată. Ultimul mod, Doar mențiuni, este cel mai strict: primiți notificări doar când cineva vă menționează cu @. Această setare este personală."
  text_nf_per_project_hint: "Pentru un anumit proiect puteți seta o regulă care o înlocuiește pe cea globală. Fără excepție, se aplică setarea globală."
  text_nf_transitions_hint: "Bifați tranzițiile (din → în) despre care doriți să fiți notificat chiar și fără comentariu. Se aplică în modul „Comentarii + modificări ale subiectului/descrierii + tranzițiile de stare selectate”. (Comentariile vă notifică întotdeauna, indiferent de aceasta.)"
  label_nf_suppress_mail: "Nu trimite notificări"
  text_nf_suppress_mail_tip: "Nimeni nu primește e-mail sau notificare în clopoțel despre acest comentariu sau această modificare, nici persoanele menționate cu @. Util pentru corecturi mici despre care nu trebuie să știe nimeni."
  permission_suppress_mail_issue_switch: "Suprimarea notificărilor la modificarea tichetelor"
