pl:
  label_notification_filter: "Filtr powiadomień"
  label_nf_global: "Ustawienia globalne (dotyczą wszystkich projektów)"
  label_nf_per_project: "Wyjątki dla poszczególnych projektów"
  label_nf_add_project: "Dodaj wyjątek dla projektu"
  label_nf_choose_project: "wybierz projekt"
  label_nf_add_button: "Dodaj"
  label_nf_mode_inherit: "Użyj ustawień globalnych"
  label_nf_mode_all: "Wysyłaj wszystkie zmiany (jak dotychczas)"
  label_nf_mode_comments_only: "Tylko komentarze – oraz zmiany tematu lub opisu, nic więcej"
  label_nf_mode_transitions: "Komentarze + zmiany tematu/opisu + wybrane przejścia między statusami (poniżej)"
  label_nf_mode_mentions_only: "Tylko wzmianki – tylko gdy ktoś wspomni Cię przez @ (w komentarzu lub w opisie); nic więcej, nawet nowe zagadnienia i przypisania"
  text_nf_mentions_only_tip: "Aby wzmianki docierały, powiadomienia e-mail muszą być włączone: %{account} → %{field} → dowolna opcja oprócz „%{none}”. Przy „%{none}” Redmine nie wysyła nic, nawet wzmianek (ani e-maila, ani dzwonka)."
  text_notification_filter_intro: "Wybierz, o których zmianach zagadnień chcesz być powiadamiany (e-mail i dzwonek). W pierwszych trzech trybach komentarze oraz zmiany tematu lub opisu powiadamiają ZAWSZE. W dwóch środkowych trybach nic poza tym – zmiany statusu tylko wtedy, gdy zaznaczysz je poniżej; inne pola (wersja docelowa, przypisany do, merge request, pliki…) nigdy. Ostatni tryb, Tylko wzmianki, jest najbardziej restrykcyjny: dostaniesz powiadomienie tylko wtedy, gdy ktoś wspomni Cię przez @. To ustawienie dotyczy tylko Ciebie."
  text_nf_per_project_hint: "Dla konkretnego projektu możesz ustawić regułę, która zastępuje globalną. Bez wyjątku obowiązuje ustawienie globalne."
  text_nf_transitions_hint: "Zaznacz przejścia (z → do), o których chcesz być powiadamiany nawet bez komentarza. Dotyczy trybu 'Komentarze + zmiany tematu/opisu + wybrane przejścia między statusami'. (Komentarze powiadamiają zawsze, niezależnie od tego.)"
  label_nf_suppress_mail: "Nie wysyłaj powiadomień"
  text_nf_suppress_mail_tip: "Nikt nie dostanie e-maila ani powiadomienia w dzwonku o tym komentarzu lub zmianie, nawet osoby wspomniane przez @. Przydaje się przy drobnych poprawkach, o których nikt nie musi wiedzieć."
  permission_suppress_mail_issue_switch: "Wyłączanie powiadomień przy zmianach zagadnień"
