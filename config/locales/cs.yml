  label_notification_filter: "Filtr notifikací"
  label_nf_global: "Globální nastavení (platí pro všechny projekty)"
  label_nf_per_project: "Výjimky pro jednotlivé projekty"
  label_nf_add_project: "Přidat výjimku pro projekt"
  label_nf_choose_project: "vyber projekt"
  label_nf_add_button: "Přidat"
  label_nf_mode_inherit: "Použít globální nastavení"
  label_nf_mode_all: "Posílat všechny změny (jako dosud)"
  label_nf_mode_comments_only: "Jen komentáře – a změny názvu nebo popisu, nic jiného"
  label_nf_mode_transitions: "Komentáře + změny názvu/popisu + jen vybrané přechody stavů (níže)"
  label_nf_mode_mentions_only: "Jen zmínky – jen když tě někdo zmíní přes @ (v komentáři nebo v popisu); nic jiného, ani nové úkoly a přiřazení"
  text_nf_mentions_only_tip: "Aby zmínky chodily, musí být zapnutá e-mailová upozornění: %{account} → %{field} → cokoli kromě „%{none}“. S volbou „%{none}“ Redmine nepošle nic, ani zmínky (ani e-mail, ani zvoneček)."
  text_notification_filter_intro: "Zde si nastavíš, o kterých změnách úkolů chceš dostávat notifikace (e-mail i zvoneček). V prvních třech režimech ti komentáře a změny názvu nebo popisu přijdou VŽDY. Ve dvou prostředních režimech už nic jiného – změny stavu jen ty, které níže zaškrtneš; ostatní pole (cílová verze, řešitel, merge request, přílohy…) nikdy. Poslední režim, Jen zmínky, je nejpřísnější: přijde ti jen to, kde tě někdo zmíní přes @. Nastavení je jen tvoje osobní."
  text_nf_per_project_hint: "Pro konkrétní projekt můžeš nastavit vlastní pravidlo, které přebije globální. Bez výjimky se použije globální nastavení."
  text_nf_transitions_hint: "Zaškrtni přechody (odkud → kam), o kterých chceš být informován i bez komentáře. Platí v režimu „Komentáře + změny názvu/popisu + jen vybrané přechody stavů“. (Komentáře chodí vždy, nezávisle na tomto.)"
