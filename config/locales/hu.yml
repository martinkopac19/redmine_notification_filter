  label_notification_filter: "Értesítésszűrő"
  label_nf_global: "Globális beállítások (minden projektre érvényesek)"
  label_nf_per_project: "Projektenkénti felülbírálások"
  label_nf_add_project: "Projekt felülbírálás hozzáadása"
  label_nf_choose_project: "válasszon projektet"
  label_nf_add_button: "Hozzáad"
  label_nf_mode_inherit: "Globális beállítások használata"
  label_nf_mode_all: "Minden változás küldése (mint eddig)"
  label_nf_mode_comments_only: "Csak megjegyzések – valamint a tárgy vagy a leírás módosítása, semmi más"
  label_nf_mode_transitions: "Megjegyzések + tárgy/leírás módosítása + kiválasztott státusz-átmenetek (lent)"
  label_nf_mode_mentions_only: "Csak említések – csak ha valaki @-tal megemlíti Önt (megjegyzésben vagy a leírásban); semmi más, új feladatok és hozzárendelések sem"
  text_notification_filter_intro: "Válassza ki, mely feladatváltozásokról kapjon értesítést (e-mail és csengő). Az első három módban a megjegyzésekről és a tárgy vagy a leírás módosításáról MINDIG kap értesítést. A két középső módban semmi másról – státuszváltozásról csak akkor, ha lent bejelöli; más mezőkről (cél verzió, felelős, merge request, fájlok…) soha. Az utolsó mód, a Csak említések, a legszigorúbb: csak akkor kap értesítést, ha valaki @-tal megemlíti Önt. Ez a beállítás csak Önre vonatkozik."
  text_nf_per_project_hint: "Egy adott projektre megadhat olyan szabályt, amely felülbírálja a globálisat. Felülbírálás nélkül a globális beállítás érvényes."
  text_nf_transitions_hint: "Jelölje be azokat az átmeneteket (honnan → hová), amelyekről megjegyzés nélkül is értesítést szeretne kapni. A 'Megjegyzések + tárgy/leírás módosítása + kiválasztott státusz-átmenetek' módban érvényes. (Megjegyzésekről ettől függetlenül mindig kap értesítést.)"
